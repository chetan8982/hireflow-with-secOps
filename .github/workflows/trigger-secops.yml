- name: Trigger SecOps Pipeline
  env:
    SECOPS_TRIGGER_TOKEN: ${{ secrets.SECOPS_TRIGGER_TOKEN }}
  run: |
    curl --fail-with-body \
      -L \
      -X POST \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer ${SECOPS_TRIGGER_TOKEN}" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/chetan8982/SecOps/dispatches \
      -d '{
        "event_type": "application_push",
        "client_payload": {
          "repository": "chetan8982/hireflow-with-secOps",
          "branch": "main",
          "commit_sha": "${{ github.sha }}"
        }
      }'